[tool.poetry]
name = "whisper-asr-webservice"
version = "1.10.0-dev"
description = "Whisper ASR Webservice is a general-purpose speech recognition webservice."
authors = ["Ahmet Öner <ahmet@example.com>", "Besim Alibegovic <besim@example.com>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
fastapi = ">=0.115.14"
uvicorn = {version=">=0.35.0", extras=["standard"]}
python-multipart = ">=0.0.20"
ffmpeg-python = ">=0.2.0"
numpy = ">=2.2.6"
openai-whisper = ">=20250625"
faster-whisper = ">=1.1.1"
whisperx = ">=3.4.2"
tqdm = ">=4.67.1"
llvmlite = ">=0.44.0"
numba = ">=0.61.2"

# NeMo diarization + helpers
nemo_toolkit = {version=">=1.23.0", extras=["asr"]}
webdataset = ">=1.0.2"
lhotse = ">=1.31.1"
soundfile = ">=0.12.1"

[tool.poetry.extras]
cpu = ["torch==2.7.1", "torchaudio==2.7.1"]
cuda = ["torch==2.7.1+cu126", "torchaudio==2.7.1+cu126"]

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[[tool.poetry.source]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu126"
priority = "explicit"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3.4,<9.0.0"
ruff = ">=0.9.6,<1.0.0"
black = ">=25.1.0,<26.0.0"
mkdocs-material = ">=9.6.4,<10.0.0"
pymdown-extensions = ">=10.14.3,<11.0.0"

[tool.poetry.scripts]
whisper-asr-webservice = "app.webservice:start"

[build-system]
requires = ["poetry-core>=1.9.0,<2.0"]
build-backend = "poetry.core.masonry.api"

# (Optional: keep your ruff/black config below)


[tool.black]
skip-string-normalization = true
line-length = 120

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = [
    "E501",  # line too long, handled by black
    "C901",  # too complex
]

[tool.ruff.lint.isort]
order-by-type = true
relative-imports-order = "closest-to-furthest"
extra-standard-library = ["typing"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]
known-first-party = []
